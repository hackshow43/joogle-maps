<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Joogle Maps</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#16232B">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./favicon.ico" sizes="32x32">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=3">
</head>
<body>

<div id="map"></div>

<div class="brand">
  <img class="brand-mark" src="./icons/icon-192.png" alt="Joogle Maps">
  <div class="brand-text">Joogle Maps<small>powered by shameless imitation</small></div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16232B" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Where to?" autocomplete="off">
    <button class="search-btn" id="searchBtn" title="Search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F7F8F5" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>
  <div class="results" id="results"></div>
</div>

<div class="toolbar">
  <button class="tool-btn" id="savedBtn"><span class="tip">Saved places</span>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 21l-5.5-3-5.5 3V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2z"/></svg>
  </button>
  <button class="tool-btn" id="historyBtn"><span class="tip">Search history</span>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
  </button>
  <button class="tool-btn" id="locateBtn"><span class="tip">Find me</span>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
  <button class="tool-btn" id="routeBtn"><span class="tip">Plot a route</span>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M6 16.8V13a4 4 0 0 1 4-4h2a4 4 0 0 0 4-4"/></svg>
  </button>
  <button class="tool-btn" id="terrainBtn"><span class="tip">Toggle terrain</span>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20l6-11 4 6 3-5 5 10z"/></svg>
  </button>
  <button class="tool-btn" id="darkBtn"><span class="tip">Night mode</span>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.6A9 9 0 1 1 11.4 3a7 7 0 0 0 9.6 9.6z"/></svg>
  </button>
</div>

<div class="route-card" id="routeCard">
  <button class="rc-close" id="rcClose">✕</button>
  <div class="rc-title">🧭 <span id="rcTitleText">Route plotted</span></div>
  <div class="rc-stats">
    <div class="rc-stat"><span class="num" id="rcDist">–</span><span class="lbl">Distance</span></div>
    <div class="rc-stat"><span class="num" id="rcTime">–</span><span class="lbl">Est. time</span></div>
  </div>
  <div class="rc-hint" id="rcHint">Click a start point, then an end point on the map.</div>
  <div class="rc-actions" id="rcActions" style="display:none;">
    <button class="pill-btn primary" id="shareBtn">Copy share link</button>
  </div>
</div>

<div class="credit">map data © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors</div>

<!-- Saved places panel -->
<div class="panel" id="savedPanel">
  <div class="panel-header"><h3>Saved places</h3><button id="savedPanelClose">✕</button></div>
  <div class="panel-body" id="savedList"><div class="panel-empty">Star a place from search or a map pin to save it here.</div></div>
</div>

<!-- History panel -->
<div class="panel" id="historyPanel">
  <div class="panel-header"><h3>Search history</h3><button id="historyPanelClose">✕</button></div>
  <div class="panel-body" id="historyList"><div class="panel-empty">Your last searches will show up here.</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script type="module" src="./app.js?v=3"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
